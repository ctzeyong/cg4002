# Mosquitto config for MQTT bring-up: plaintext, no auth.
#
# NOT the demo config. This exists so the phone-to-broker leg can be proved
# before the mTLS material exists, and before the broker location is settled.
# The mTLS block at the bottom replaces it in Week 6.
#
# Run it explicitly rather than as a Windows service, so the broker's log is on
# screen next to the relay's during a demo. Run it FROM THIS DIRECTORY -- the
# include_dir at the bottom is resolved against the working directory, not
# against this file:
#
#     cd comms\laptop
#     & "C:\Program Files\Mosquitto\mosquitto.exe" -c mosquitto.conf -v
#
# Mosquitto is also installed as a Windows *service* on this laptop. When that
# service is running it holds 1883 and this file will fail to bind, so check
# before you start, and stop it if needed:
#
#     Get-Service mosquitto
#     Stop-Service mosquitto      # needs an elevated shell
#
# The service runs Mosquitto 2.0's no-listener default: loopback only, anonymous
# allowed. That default is why 127.0.0.1 testing can pass while the phone still
# cannot connect — it never binds an address the phone can reach. Do not assume
# the phone is talking to *this* config just because something answers on 1883;
# two brokers on one port is a silent-wrong-broker failure, not an error.

# Two named listeners, not 0.0.0.0: loopback for the relay, the laptop's own AP
# for the phone, nothing on the NUS-assigned address. Why that matters, and the
# start-order it forces, are in notes/demo_network.md.
# listener 1883 0.0.0.0
listener 1883 127.0.0.1
listener 1883 192.168.137.1

# Anonymous access for bring-up only. Identity arrives in Week 6 as client
# certificates, not passwords: `use_identity_as_username true` below makes the
# cert CN the username, so there is never a secret to ship inside the APK.
allow_anonymous true

# no on-disk queue for offline clients since bring-up runs are short
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# uncomment to see every CONNECT/SUBSCRIBE/PUBLISH. Verbose, but it is the
# fastest way to tell "the phone never reached the broker" from "the phone
# connected and the topic is wrong".
#log_type debug

# log the client id on connect.
connection_messages true

# ---------------------------------------------------------------------------
# Week 6: mTLS. The 8883 listener is NOT in this file. It lives in
# local/tls.conf, which make_certs.ps1 generates alongside the cert material and
# .gitignore keeps out of the repo.
#
# Two reasons it is a separate file rather than a commented block here:
#
#   1. Mosquitto has no secrets mechanism and does NOT expand environment
#      variables -- `cafile ${CERTS}/ca.crt` reaches OpenSSL as that literal
#      string. The only way to give it a path is to write the path. Absolute
#      paths contain the Windows username, which must not be committed, so the
#      file holding them must be one git never sees.
#   2. mTLS then turns on by *generating material*, not by editing config. There
#      is no commented-out listener to half-uncomment at 2am.
#
# Verified against Mosquitto 2.1.2, 2026-09-17:
#   - An included file starts in a FRESH listener context, so local/tls.conf has
#     to carry its own `listener` lines. TLS options alone give
#     "Error: The 'cafile' option requires a listener to be defined first".
#   - include_dir is relative to the WORKING DIRECTORY, not to this file --
#     which is why the command above cd's first. Get it wrong and mosquitto
#     aborts with "Unable to open include_dir 'local'" *before* opening any
#     socket, so it fails loudly rather than coming up plaintext-only.
#   - The directory must hold at least one *.conf or startup ABORTS -- an
#     include_dir with no match is an error, not an empty include, and a
#     .gitkeep does not satisfy it because only *.conf is scanned. That is what
#     local/00-placeholder.conf is for. Until make_certs.ps1 drops tls.conf in
#     beside it, this line is a no-op and the broker is plaintext as before.
include_dir local
