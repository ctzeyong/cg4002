# Mosquitto config for the laptop-broker setup on a phone-hotspot uplink: plaintext, no auth.
# That setup was evaluated but is not used in the final system.
#
# A template, not a runnable config. scripts/run_pipeline_a_hotspot.ps1 writes a per-run
# copy under logs\ with HOTSPOT_LEASE replaced by the laptop's address on the phone's
# hotspot, and log_dest stdout replaced by a log file. The lease changes every session,
# so it cannot be written here. Campus runs use mosquitto.conf instead.
#
# How this differs from mosquitto.conf, and why:
#   - The phone reaches the broker on the phone's own hotspot, not the laptop's AP, so
#     the second listener is the hotspot lease instead of 192.168.137.1. The script
#     refuses to run on an NUS network, so this never listens on an NUS address.
#   - No include_dir local: local/tls.conf adds an 8883 listener on 192.168.137.1, which
#     does not exist when the laptop's own hotspot is off, and Mosquitto would abort.
#     This setup ran plaintext in the latency comparison.
# Everything else matches mosquitto.conf; tests/test_mosquitto_hotspot_conf.py checks that.

listener 1883 127.0.0.1
listener 1883 HOTSPOT_LEASE

allow_anonymous true
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

connection_messages true
