# Machine-local Mosquitto config fragments. This directory is included by
# ../mosquitto.conf via `include_dir local`.
#
# This file exists to keep the directory valid and does nothing else.
# Mosquitto 2.1.2 treats an include_dir containing no *.conf file as an ERROR
# ("Unable to open include_dir"), not as an empty include -- verified
# 2026-09-17 -- and it aborts before opening any listener. A .gitkeep does not
# satisfy it, because only *.conf is scanned. A comment-only .conf does.
#
# What actually lands here: tls.conf, generated by make_certs.ps1. It carries
# the whole 8883 mTLS listener block, including absolute paths to comms/certs/.
# Those paths contain the Windows username, which is why this directory's real
# contents are gitignored -- Mosquitto expands no environment variables, so
# there is no way to indirect the path through a secrets file.
#
# Everything here is machine-local. Nothing in it belongs in a commit except
# this file.
